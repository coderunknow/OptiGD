name: Build & Verify OptiGD

on:
  push:
    branches: [ main, master, "arena/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Job 1: Standalone C++20 Core Engine, Unit Tests, & Benchmark Verification
  # ==========================================================================
  standalone-test-and-benchmark:
    name: Core Engine Tests & Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake (Standalone Mode)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPTIGD_STANDALONE_ONLY=ON

      - name: Build Core Engine, Tests & Benchmark Suite
        run: cmake --build build --config Release --parallel

      - name: Run Unit & Integration Tests
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Run Performance Benchmark Suite
        shell: bash
        run: |
          if [ -f "./build/Release/optigd_benchmark.exe" ]; then
            ./build/Release/optigd_benchmark.exe benchmark_results.json
          elif [ -f "./build/optigd_benchmark.exe" ]; then
            ./build/optigd_benchmark.exe benchmark_results.json
          else
            ./build/optigd_benchmark benchmark_results.json
          fi

      - name: Verify Benchmark & Version Metadata
        shell: bash
        run: |
          jq -e '.optigd_version == "0.1.0-beta.3"' benchmark_results.json
          jq -e '.evidence_classification == "[SIMULATED]"' benchmark_results.json
          python3 tools/generate_report.py benchmark_results.json

      - name: Upload Benchmark Telemetry Artifact
        uses: actions/upload-artifact@v7
        with:
          name: optigd-benchmark-${{ matrix.os }}
          path: benchmark_results.json

  # ==========================================================================
  # Job 2: Geode SDK Cross-Platform Mod Compilation (Win64, Android32, Android64)
  # ==========================================================================
  build-geode-mod:
    name: Geode Mod (${{ matrix.name }})
    needs: standalone-test-and-benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: Win64
            expected_bin: coderunknow.optigd.dll
          - name: Android64 (arm64-v8a)
            os: ubuntu-latest
            target: Android64
            expected_bin: coderunknow.optigd.android64.so
          - name: Android32 (armeabi-v7a)
            os: ubuntu-latest
            target: Android32
            expected_bin: coderunknow.optigd.android32.so

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Geode Mod Package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.target }}
          build-config: Release

      - name: Verify Platform .geode Package Contents
        shell: bash
        run: |
          GEODE_FILE="${{ steps.build.outputs.build-output }}/coderunknow.optigd.geode"
          if [ ! -f "$GEODE_FILE" ]; then
            echo "ERROR: Expected .geode package not found at $GEODE_FILE"
            exit 1
          fi
          unzip -l "$GEODE_FILE"
          unzip -l "$GEODE_FILE" | grep -F "${{ matrix.expected_bin }}"
          unzip -p "$GEODE_FILE" mod.json | jq -e '.version == "v0.1.0-beta.3"'
          unzip -p "$GEODE_FILE" mod.json | jq -e '.id == "coderunknow.optigd"'

      # Publishes the exact package a tester installs, named with the platform, the
      # mod version and the commit it was built from, plus its SHA-256 so a
      # downloaded file can be matched to this run. This step changes nothing about
      # what is built: it re-packages the artefact the action already produced and
      # the step above already verified.
      - name: Prepare Installable Package For Download
        id: package
        shell: bash
        run: |
          set -euo pipefail
          GEODE_FILE="${{ steps.build.outputs.build-output }}/coderunknow.optigd.geode"
          VERSION=$(jq -r '.version' mod.json)
          GEODE_REQ=$(jq -r '.geode' mod.json)
          TARGET="${{ matrix.target }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          PKG_NAME="coderunknow.optigd-${VERSION}-${TARGET}.geode"

          mkdir -p dist
          cp "$GEODE_FILE" "dist/${PKG_NAME}"
          (cd dist && sha256sum "${PKG_NAME}" > SHA256SUMS.txt)
          CHECKSUM=$(awk '{print $1}' dist/SHA256SUMS.txt)
          SIZE_BYTES=$(wc -c < "dist/${PKG_NAME}" | tr -d '[:space:]')

          if [ "$TARGET" = "Win64" ]; then
          INSTALL_STEPS="  1. Make sure Geode is already installed and Geometry Dash starts with the
               Geode loader (a Geode button appears in the game's main menu).
            2. In the game, open Geode -> Mods and use the folder button there to open
               the mods directory. That is the authoritative location on your machine -
               do not assume a Steam install path. Equivalently, it is the
               \"geode/mods\" folder inside your Geometry Dash installation.
            3. Copy ${PKG_NAME} into that folder.
            4. Restart Geometry Dash. OptiGD should be listed in Geode -> Mods with
               version ${VERSION}."
          else
          INSTALL_STEPS="  1. Make sure Geode is already installed for Geometry Dash on this device.
            2. Open the Geode app (or the in-game Geode menu) -> Mods, and use its
               folder/browse option to reach the mods directory. On Android that is
               normally Android/data/com.robtopx.geometryjump/geode/mods - reach it
               through Geode rather than assuming a path.
            3. Copy ${PKG_NAME} into that folder.
            4. Restart Geometry Dash and check Geode -> Mods for OptiGD ${VERSION}."
          fi

          cat > dist/INSTALL.txt <<TXT
          OptiGD ${VERSION} - Geode mod package for ${TARGET}

          Built from commit ${GITHUB_SHA}
          GitHub Actions run ${GITHUB_RUN_ID} (job ${{ matrix.name }})
          File        : ${PKG_NAME}
          Size        : ${SIZE_BYTES} bytes
          SHA-256     : ${CHECKSUM}
          Requires    : Geode ${GEODE_REQ} and the Geometry Dash version mod.json targets

          WHAT THIS IS
            A Geode mod package. It is not a standalone program, it does not replace any
            game file, and it does nothing until Geode loads it.

          HOW TO INSTALL
          ${INSTALL_STEPS}

          HOW TO CHECK THE FILE YOU DOWNLOADED
            Windows PowerShell : Get-FileHash -Algorithm SHA256 ${PKG_NAME}
            Linux / macOS      : sha256sum ${PKG_NAME}
            The value must equal the SHA-256 above.

          IF IT DOES NOT LOAD, OR SOMETHING LOOKS WRONG
            Open the Geode log (in-game Geode -> Logs, or geode.log next to the game
            executable) and look for lines containing "coderunknow.optigd". When
            reporting a problem, include those lines, the OptiGD version, the Geode
            version and, for Benchmark Mode, the session files under
            <mods folder>/coderunknow.optigd/benchmarks/.
          TXT

          {
          echo "### Installable package - ${TARGET}"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Artifact | \`OptiGD-${VERSION}-${TARGET}-${SHORT_SHA}\` |"
          echo "| File | \`${PKG_NAME}\` |"
          echo "| Version | \`${VERSION}\` |"
          echo "| Target | \`${TARGET}\` |"
          echo "| Commit | \`${GITHUB_SHA}\` |"
          echo "| Run | \`${GITHUB_RUN_ID}\` |"
          echo "| Size | ${SIZE_BYTES} bytes |"
          echo "| SHA-256 | \`${CHECKSUM}\` |"
          echo ""
          echo "<details><summary>Archive contents</summary>"
          echo ""
          echo '```'
          unzip -l "dist/${PKG_NAME}"
          echo '```'
          echo ""
          echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "artifact_name=OptiGD-${VERSION}-${TARGET}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"

      - name: Upload Installable Package (${{ matrix.target }})
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/*.geode
            dist/SHA256SUMS.txt
            dist/INSTALL.txt
          if-no-files-found: error

  # ==========================================================================
  # Job 3: Combine Multi-Platform .geode Package & Verify Combined Archive
  # ==========================================================================
  combine:
    name: Package Combined .geode Artifact
    needs: build-geode-mod
    runs-on: ubuntu-latest
    steps:
      - name: Combine Platform Binaries
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Verify Combined Multi-Platform .geode Archive
        shell: bash
        run: |
          COMBINED_FILE="${{ steps.combine.outputs.build-output }}/coderunknow.optigd.geode"
          if [ ! -f "$COMBINED_FILE" ]; then
            echo "ERROR: Combined .geode file missing at $COMBINED_FILE"
            exit 1
          fi
          echo "=== Combined .geode Archive Contents ==="
          unzip -l "$COMBINED_FILE"
          unzip -l "$COMBINED_FILE" | grep -F "coderunknow.optigd.dll"
          unzip -l "$COMBINED_FILE" | grep -F "coderunknow.optigd.android64.so"
          unzip -l "$COMBINED_FILE" | grep -F "coderunknow.optigd.android32.so"
          unzip -p "$COMBINED_FILE" mod.json | jq -e '.version == "v0.1.0-beta.3"'

      # Same treatment for the multi-platform package a release would ship: a
      # name that carries the version and the commit, and a recorded SHA-256.
      - name: Prepare Combined Package For Download
        id: combined_package
        shell: bash
        run: |
          set -euo pipefail
          COMBINED_FILE="${{ steps.combine.outputs.build-output }}/coderunknow.optigd.geode"
          # This job never checks the repository out (the combine action only
          # downloads the CLI and the per-platform archives), so there is no
          # mod.json on disk to read - take the version from the archive, the way
          # the verification step above does.
          VERSION=$(unzip -p "$COMBINED_FILE" mod.json | jq -r '.version')
          SHORT_SHA="${GITHUB_SHA::7}"
          PKG_NAME="coderunknow.optigd-${VERSION}-combined.geode"

          mkdir -p dist
          cp "$COMBINED_FILE" "dist/${PKG_NAME}"
          (cd dist && sha256sum "${PKG_NAME}" > SHA256SUMS.txt)
          CHECKSUM=$(awk '{print $1}' dist/SHA256SUMS.txt)
          SIZE_BYTES=$(wc -c < "dist/${PKG_NAME}" | tr -d '[:space:]')

          {
          echo "### Installable package - combined (Win64 + Android64 + Android32)"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Artifact | \`OptiGD-${VERSION}-combined-${SHORT_SHA}\` |"
          echo "| File | \`${PKG_NAME}\` |"
          echo "| Commit | \`${GITHUB_SHA}\` |"
          echo "| Size | ${SIZE_BYTES} bytes |"
          echo "| SHA-256 | \`${CHECKSUM}\` |"
          echo ""
          echo "<details><summary>Archive contents</summary>"
          echo ""
          echo '```'
          unzip -l "dist/${PKG_NAME}"
          echo '```'
          echo ""
          echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "artifact_name=OptiGD-${VERSION}-combined-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha256=${CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"

      - name: Upload Combined .geode Mod
        uses: actions/upload-artifact@v7
        with:
          name: coderunknow.optigd-geode-package
          path: ${{ steps.combine.outputs.build-output }}/*.geode

      - name: Upload Named Combined Package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.combined_package.outputs.artifact_name }}
          path: |
            dist/*.geode
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # ==========================================================================
  # Job 4: Download the published artefacts again and verify them as a tester
  #        would, then record the checksums on the pull request.
  #
  # The per-platform jobs verify the archive they just built. This job verifies
  # what was actually PUBLISHED: it downloads the artefacts back out of Actions
  # storage, re-computes each SHA-256 against the SHA256SUMS.txt inside the
  # artefact, opens the .geode to check its binary and its mod.json, and checks
  # that the artefact name carries the version, the platform and the commit. A
  # mismatch fails the job rather than being reported as a note.
  #
  # It also exists because the checksum has to be readable: job logs and the
  # $GITHUB_STEP_SUMMARY of a matrix job are not reachable through the API from
  # a sandboxed environment, so the numbers are posted to the pull request.
  # ==========================================================================
  verify-published-artifacts:
    name: Verify Published Artefacts & Record Checksums
    needs: [build-geode-mod, combine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Published Artefacts
        uses: actions/download-artifact@v7
        with:
          pattern: OptiGD-*
          path: downloads

      - name: Verify Every Published Artefact
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION=$(jq -r '.version' mod.json)
          EXPECTED_ID=$(jq -r '.id' mod.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          FAILURES=0
          : > report.md
          : > summary.md

          note() { echo "$@" >> report.md; }

          note "| Artefact | File | Platform binaries | Bytes | SHA-256 | Checks |"
          note "| --- | --- | --- | --- | --- | --- |"

          shopt -s nullglob
          dirs=(downloads/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "ERROR: no OptiGD-* artefacts were published by this run"
            exit 1
          fi

          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            checks=0
            problems=""
            fail() { problems="${problems}${problems:+; }$1"; FAILURES=$((FAILURES + 1)); }

            geodes=("$dir"*.geode)
            if [ "${#geodes[@]}" -ne 1 ]; then
              fail "expected exactly one .geode, found ${#geodes[@]}"
              note "| \`${name}\` | - | - | - | - | **FAIL**: ${problems} |"
              continue
            fi
            pkg="${geodes[0]}"
            pkg_name=$(basename "$pkg")

            # The platform sits between two dashes, so the pattern must be open
            # at both ends: `*"-Win64-"` would require the name to END there.
            case "$name" in
              *"-Win64-"*)      target=Win64      ; bins="coderunknow.optigd.dll" ;;
              *"-Android64-"*)  target=Android64  ; bins="coderunknow.optigd.android64.so" ;;
              *"-Android32-"*)  target=Android32  ; bins="coderunknow.optigd.android32.so" ;;
              *"-combined-"*)   target=combined   ; bins="coderunknow.optigd.dll coderunknow.optigd.android64.so coderunknow.optigd.android32.so" ;;
              *) fail "artefact name does not identify a platform"; target="?" ; bins="" ;;
            esac

            # name carries version, platform and commit
            if [ "$name" = "OptiGD-${EXPECTED_VERSION}-${target}-${SHORT_SHA}" ]; then
              checks=$((checks + 1))
            else
              fail "name is not OptiGD-${EXPECTED_VERSION}-${target}-${SHORT_SHA}"
            fi
            if [ "$pkg_name" = "coderunknow.optigd-${EXPECTED_VERSION}-${target}.geode" ]; then
              checks=$((checks + 1))
            else
              fail "package file is not coderunknow.optigd-${EXPECTED_VERSION}-${target}.geode"
            fi

            # checksum recorded inside the artefact must match the file
            if [ -f "${dir}SHA256SUMS.txt" ]; then
              if (cd "$dir" && sha256sum -c SHA256SUMS.txt --quiet); then
                checks=$((checks + 1))
              else
                fail "SHA256SUMS.txt does not match the packaged file"
              fi
            else
              fail "no SHA256SUMS.txt in the artefact"
            fi
            checksum=$(sha256sum "$pkg" | awk '{print $1}')
            size=$(wc -c < "$pkg" | tr -d '[:space:]')

            # the archive must contain what a Geode loader needs, and nothing
            # belonging to another platform
            listing=$(unzip -l "$pkg")
            if echo "$listing" | grep -qF " mod.json"; then
              checks=$((checks + 1))
            else
              fail "archive has no mod.json"
            fi
            for bin in $bins; do
              if echo "$listing" | grep -qF " $bin"; then
                checks=$((checks + 1))
              else
                fail "archive is missing $bin"
              fi
            done
            for foreign in coderunknow.optigd.dll coderunknow.optigd.android64.so coderunknow.optigd.android32.so; do
              case " $bins " in
                *" $foreign "*) continue ;;
              esac
              if echo "$listing" | grep -qF " $foreign"; then
                fail "archive contains $foreign, which does not belong to a ${target} package"
              fi
            done

            inner_id=$(unzip -p "$pkg" mod.json | jq -r '.id')
            inner_version=$(unzip -p "$pkg" mod.json | jq -r '.version')
            inner_geode=$(unzip -p "$pkg" mod.json | jq -r '.geode')
            if [ "$inner_id" = "$EXPECTED_ID" ] && [ "$inner_version" = "$EXPECTED_VERSION" ]; then
              checks=$((checks + 1))
            else
              fail "inner mod.json is ${inner_id} ${inner_version}, expected ${EXPECTED_ID} ${EXPECTED_VERSION}"
            fi

            if [ "$target" != "combined" ] && [ "$target" != "?" ]; then
              if [ -f "${dir}INSTALL.txt" ]; then
                checks=$((checks + 1))
              else
                fail "no INSTALL.txt in the artefact"
              fi
            fi

            if [ -z "$problems" ]; then
              note "| \`${name}\` | \`${pkg_name}\` | ${bins// /, } | ${size} | \`${checksum}\` | ${checks} passed |"
            else
              note "| \`${name}\` | \`${pkg_name}\` | ${bins// /, } | ${size} | \`${checksum}\` | **FAIL**: ${problems} |"
            fi
            echo "- ${name} | Geode ${inner_geode} | ${size} bytes | sha256:${checksum}" >> summary.md
          done

          {
            echo "### Published artefacts, re-downloaded and verified"
            echo ""
            echo "Commit \`${GITHUB_SHA}\`, run ${GITHUB_RUN_ID}. Every artefact below was"
            echo "downloaded back out of Actions storage by this job; the SHA-256 is"
            echo "re-computed here and compared with the SHA256SUMS.txt inside the artefact."
            echo ""
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"

          cat report.md
          if [ "$FAILURES" -ne 0 ]; then
            echo "ERROR: ${FAILURES} artefact check(s) failed"
            exit 1
          fi
          echo "all published artefacts verified"

      - name: Record Checksums On The Pull Request
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" \
                 --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "no open pull request for $GITHUB_REF_NAME; nothing to record"
            exit 0
          fi
          VERSION=$(jq -r '.version' mod.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "### Installable artefacts for commit \`${GITHUB_SHA}\`"
            echo ""
            echo "Run [\`${GITHUB_RUN_ID}\`](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "Each artefact was downloaded back out of Actions storage and re-verified by the"
            echo "\`Verify Published Artefacts & Record Checksums\` job: name, package file name,"
            echo "SHA-256 against the checksum file inside the artefact, archive contents, and the"
            echo "\`mod.json\` inside the archive."
            echo ""
            cat report.md
            echo ""
            echo "Download from the run page above (Artefacts section), or:"
            echo ""
            echo '```'
            echo "gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --name OptiGD-${VERSION}-Win64-${SHORT_SHA} --dir optigd-win64"
            echo '```'
            echo ""
            echo "Nothing here has been loaded by Geode or run inside Geometry Dash: a green job"
            echo "means the package was built, published and verified as an archive."
          } > pr-comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file pr-comment.md
