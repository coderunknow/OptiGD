# Verification pipeline for OptiGD v0.1.0-beta1.
#
# Pins (update deliberately, in a reviewed commit):
#   - Geode SDK: taken from mod.json ("geode": "5.10.1") via build-geode-mod sdk: given.
#   - Geode CLI: v3.9.0.
#   - Bindings: geode-sdk/bindings at f8aec5d1f3df76d840dfd2609f02cef30dc6efdf (GD 2.2081).
#   - Actions: pinned to full commit SHAs.
#
# A job is green only when its verification steps pass. A green "build" job means the
# binary was produced (BUILD-VERIFIED). It does not mean the mod runs in the game
# (RUNTIME-UNVERIFIED until the gameplay benchmark protocol has been executed).

name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Native tests and synthetic microbenchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build test and benchmark harness
        run: cmake --build build --verbose

      - name: Run native unit and regression tests
        run: ./build/optigd_tests

      - name: Run tool tests (analyzer on synthetic CSV)
        run: python3 -m unittest discover -s tools/tests

      - name: Run synthetic microbenchmarks [SYNTHETIC, host-only, not gameplay]
        run: ./build/optigd_benchmark

  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            target: Win64
          - name: Android 32-bit
            os: ubuntu-latest
            target: Android32
          - name: Android 64-bit
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc # main @ 2026-10-10
        with:
          sdk: given
          cli: v3.9.0
          bindings: geode-sdk/bindings
          bindings-ref: f8aec5d1f3df76d840dfd2609f02cef30dc6efdf
          combine: true
          target: ${{ matrix.config.target }}

      - name: Verify .geode output (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          set -Eeuo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find "$BUILD_OUTPUT" -maxdepth 1 -type f -name '*.geode' -print0)
          if (( ${#files[@]} != 1 )); then
            echo "::error::Expected exactly one .geode file for ${{ matrix.config.target }}, found ${#files[@]}."
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          if [[ ! -s "${files[0]}" ]]; then
            echo "::error::The .geode file for ${{ matrix.config.target }} is empty."
            exit 1
          fi
          printf 'Verified %s (%s bytes)\n' "${files[0]}" "$(stat -c '%s' "${files[0]}")"

      - name: Verify .geode output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:BUILD_OUTPUT -Filter '*.geode' -File -ErrorAction Stop)
          if ($files.Count -ne 1) {
            Write-Error "Expected exactly one .geode file for ${{ matrix.config.target }}, found $($files.Count)."
            exit 1
          }
          if ($files[0].Length -le 0) {
            Write-Error "The .geode file for ${{ matrix.config.target }} is empty."
            exit 1
          }
          Write-Output "Verified $($files[0].FullName) ($($files[0].Length) bytes)"

  package:
    name: Package combined .geode
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@a0f7676e6fcd1a584f6d0c1c800239008412defc # main @ 2026-10-10
        id: build

      - name: Upload .geode artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coderunknow.optigd.geode
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
