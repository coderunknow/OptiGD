name: Build Geode Mod

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions: write-all

jobs:
  test:
    name: Native Verification & Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure CMake
        run: cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Test & Benchmark Harness
        run: cmake --build build --verbose

      - name: Run Unit Tests
        run: |
          chmod +x build/optigd_tests
          ./build/optigd_tests

      - name: Run Synthetic Benchmarks
        run: |
          chmod +x build/optigd_benchmark
          ./build/optigd_benchmark

  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64
            os: windows-latest
            target: Win64

          - name: Android 32-bit
            os: ubuntu-latest
            target: Android32

          - name: Android 64-bit
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build_mod
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          combine: true
          target: ${{ matrix.config.target }}

      - name: Report Build Error
        if: steps.build_mod.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cmake -B build_diag -DCMAKE_BUILD_TYPE=Release -G Ninja > diag.log 2>&1 || true
          tail -n 80 diag.log
          gh pr comment 1 --body "#### ${{ matrix.config.name }} Configure Failure Log:
          \`\`\`
          $(tail -n 60 diag.log)
          \`\`\`" || true
          exit 1

  package:
    name: Package Combined .geode
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload .geode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coderunknow.optigd.geode
          path: ${{ steps.build.outputs.build-output }}
