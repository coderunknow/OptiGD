# TEMPORARY diagnostic workflow - remove once the Geode build failure is fixed.
#
# Why this exists: the three "Geode Mod" jobs of build.yml fail at the
# `geode-sdk/build-geode-mod@main` step, and the runner logs for those jobs are
# not retrievable from this environment (the log endpoint redirects to a blob
# store that is outside the network allowlist). The check-run annotations only
# carry "Process completed with exit code 1", with no compiler diagnostics.
#
# This workflow reproduces the exact configure/build commands that the composite
# action runs (copied from geode-sdk/build-geode-mod@main action.yml, commit
# a0f7676e), captures stdout+stderr to a file, and posts the filtered compiler
# output as a comment on the pull request, which IS readable through the API.
#
# It is triggered only by a change to .github/geode-diagnose-trigger, so it never
# runs on ordinary pushes, and it does not gate anything.

name: Geode Build Diagnostics (temporary)

on:
  push:
    branches: [arena/f6290987-optigd]
    paths: ['.github/geode-diagnose-trigger']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  capture-geode-build-log:
    name: Capture Geode compile output (Android64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ninja
        shell: bash
        run: |
          curl -L https://github.com/ninja-build/ninja/releases/latest/download/ninja-linux.zip -o ninja.zip
          7z x ninja.zip -o"$GITHUB_WORKSPACE/ninja"
          echo "$GITHUB_WORKSPACE/ninja" >> $GITHUB_PATH

      - name: Setup CLI
        uses: geode-sdk/cli/.github/actions/setup@main
        with:
          version: latest

      - name: Setup Geode SDK
        shell: bash
        run: |
          export CLI_PROFILE="${{ github.workspace }}/cli-profile"
          mkdir -p "$CLI_PROFILE/geode/mods"
          geode profile add --name GithubActions "$CLI_PROFILE/GeometryDash.exe" win

          geode sdk install "${{ github.workspace }}/geode-sdk-clone"

          export GEODE_SDK="${{ github.workspace }}/geode-sdk-clone"
          echo "GEODE_SDK=$GEODE_SDK" >> $GITHUB_ENV

          export MOD_JSON_PATH=$(find . -name "mod.json" -not -path "./geode-sdk-clone/*" -print | sort -r | head -n 1)
          export TARGET_GEODE_VERSION=$(jq -r '.geode' $MOD_JSON_PATH)
          echo "Updating to version $TARGET_GEODE_VERSION from $MOD_JSON_PATH"
          geode sdk update "$TARGET_GEODE_VERSION"
          geode sdk install-binaries --platform android64 --version "$TARGET_GEODE_VERSION"

          export CPM_CACHE="${{ github.workspace }}/cpm-cache"
          echo "CPM_SOURCE_CACHE=$CPM_CACHE" >> $GITHUB_ENV

      - name: Configure and build with captured output
        shell: bash
        run: |
          mkdir -p $HOME/.cache
          LOG=/tmp/geode-diag.log
          : > "$LOG"

          NDK_PATH=/usr/local/lib/android/sdk/ndk/29.0.14206865

          set +e
          cmake -B build-diag \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DGEODE_CODEGEN_CMAKE_ARGS="-DCMAKE_C_COMPILER=clang;-DCMAKE_CXX_COMPILER=clang++;-G Ninja" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_STL=c++_shared -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DGEODE_DONT_INSTALL_MODS=ON \
            -DGEODE_TARGET_PLATFORM=Android64 \
            >> "$LOG" 2>&1
          CONFIGURE_STATUS=$?
          echo "=== configure exit code: $CONFIGURE_STATUS ===" >> "$LOG"

          if [ $CONFIGURE_STATUS -eq 0 ]; then
            cmake --build build-diag --config Release --parallel >> "$LOG" 2>&1
            echo "=== build exit code: $? ===" >> "$LOG"
          fi
          set -e

          echo "=== log size: $(wc -c < "$LOG") bytes ===" >> "$LOG"

      - name: Extract diagnostics
        shell: bash
        run: |
          LOG=/tmp/geode-diag.log
          OUT=/tmp/geode-diag-comment.md
          {
            echo "### Temporary Geode build diagnostics (Android64)"
            echo
            echo "Head commit: \`${GITHUB_SHA}\`. Reproduced with the configure/build"
            echo "commands from \`geode-sdk/build-geode-mod@main\` (a0f7676e)."
            echo
            echo '```'
            grep -nE "error:|error C[0-9]+|fatal error|Error [0-9]+|undefined (symbol|reference)|ld\.lld|FAILED:|CMake Error|exit code|log size" "$LOG" | head -120
            echo '```'
            echo
            echo "<details><summary>context around the first failures</summary>"
            echo
            echo '```'
            grep -nE -B 8 -A 20 "error:|fatal error|CMake Error|FAILED:" "$LOG" | head -320
            echo '```'
            echo
            echo "</details>"
            echo
            echo "<details><summary>last 120 lines of the log</summary>"
            echo
            echo '```'
            tail -120 "$LOG"
            echo '```'
            echo
            echo "</details>"
          } > "$OUT"
          head -c 60000 "$OUT" > /tmp/geode-diag-final.md
          wc -c /tmp/geode-diag-final.md

      - name: Post diagnostics to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 7 --repo coderunknow/OptiGD --body-file /tmp/geode-diag-final.md
