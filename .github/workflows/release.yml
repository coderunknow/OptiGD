name: Release OptiGD Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  verify-tests:
    name: Pre-Release Test & Benchmark Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build Standalone
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPTIGD_STANDALONE_ONLY=ON
          cmake --build build --config Release --parallel
      - name: Execute Unit Tests
        run: ctest --test-dir build --output-on-failure --verbose
      - name: Execute Benchmarks
        run: |
          ./build/optigd_benchmark benchmark_release_report.json
          jq -e '.optigd_version == "0.1.0-beta.3"' benchmark_release_report.json
          jq -e '.evidence_classification == "[SIMULATED]"' benchmark_release_report.json
      - name: Upload Release Benchmark Report
        uses: actions/upload-artifact@v7
        with:
          name: release-benchmarks
          path: benchmark_release_report.json

  build-release-targets:
    name: Build Release (${{ matrix.name }})
    needs: verify-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: Win64
            expected_bin: coderunknow.optigd.dll
          - name: Android64
            os: ubuntu-latest
            target: Android64
            expected_bin: coderunknow.optigd.android64.so
          - name: Android32
            os: ubuntu-latest
            target: Android32
            expected_bin: coderunknow.optigd.android32.so

    steps:
      - uses: actions/checkout@v4
      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.target }}
          build-config: Release

      - name: Verify Platform .geode Package
        shell: bash
        run: |
          GEODE_FILE="${{ steps.build.outputs.build-output }}/coderunknow.optigd.geode"
          unzip -l "$GEODE_FILE" | grep -F "${{ matrix.expected_bin }}"

  publish-release:
    name: Combine & Publish GitHub Release
    needs: [verify-tests, build-release-targets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Combine .geode Artifacts
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Verify Combined .geode Archive
        shell: bash
        run: |
          COMBINED_FILE="${{ steps.combine.outputs.build-output }}/coderunknow.optigd.geode"
          unzip -l "$COMBINED_FILE" | grep -F "coderunknow.optigd.dll"
          unzip -l "$COMBINED_FILE" | grep -F "coderunknow.optigd.android64.so"
          unzip -l "$COMBINED_FILE" | grep -F "coderunknow.optigd.android32.so"

      - name: Download Benchmark Report
        uses: actions/download-artifact@v8
        with:
          name: release-benchmarks
          path: ${{ steps.combine.outputs.build-output }}

      - name: Determine Pre-Release Status
        id: prerelease
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.combine.outputs.build-output }}/*.geode
            ${{ steps.combine.outputs.build-output }}/benchmark_release_report.json
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
